services:
  stock-signal:
    build: .
    container_name: local-stock-signal
    ports:
      - "5173:5173"
    environment:
      - PORT=5173
      - HOST=0.0.0.0
      - SEARCH_PROVIDER=${SEARCH_PROVIDER:-searxng}
      - SEARXNG_URL=${SEARXNG_URL:-http://host.docker.internal:8081/search}
      - SEARXNG_ENGINES=${SEARXNG_ENGINES:-bing}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - GOOGLE_CSE_ID=${GOOGLE_CSE_ID:-}
      - LM_STUDIO_URL=${LM_STUDIO_URL:-http://host.docker.internal:1234/v1}
      - LM_STUDIO_TIMEOUT_MS=${LM_STUDIO_TIMEOUT_MS:-180000}
      - UNIT_BUDGET=${UNIT_BUDGET:-300000}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
